# Model panel. Scope rule inherited from obtune/docs/MODEL_AND_DATA_SELECTION.md (2026-09-09):
# no Chinese-origin model, which removes Kudo et al.'s main model (Qwen2.5-7B) and Yi. Their
# panel also had Llama-3.2-3B and Llama-3.1-8B, which are the two "already supported" starting
# models the plan asks for (PLAN.md §4.5), and which anchor the replication of their Table 3.
#
# n_layers / hidden_size are READ FROM config.json by scripts/00_status.py, not typed here.
# `kind` says what the model is for: core (every experiment), pair (base vs tuned contrast),
# family (robustness), reasoning (base vs reasoning-tuned contrast).
# `partition` is the SLURM partition sized for bf16 inference + hidden-state caching.
# `verified` is flipped by scripts/11_tokenizer_check.py after the model loads in a job.

default_model: llama32-3b

models:
  llama32-3b:
    hf_id: meta-llama/Llama-3.2-3B
    origin: Meta
    kind: core
    tuned: false
    partition: a30
    batch_size: 32
    note: Kudo et al. Table 3 row; the replication anchor. Cached 2026-09-12.
  llama32-3b-it:
    hf_id: meta-llama/Llama-3.2-3B-Instruct
    origin: Meta
    kind: pair
    tuned: true
    partition: a30
    batch_size: 32
    note: base-vs-instruct pair with llama32-3b. Cached 2026-09-12.
  llama31-8b:
    hf_id: meta-llama/Llama-3.1-8B
    origin: Meta
    kind: core
    tuned: false
    partition: h100
    batch_size: 16
    note: Kudo et al. Table 3 row. Cached.
  llama31-8b-it:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    origin: Meta
    kind: pair
    tuned: true
    partition: h100
    batch_size: 16
  # ---- second family: Google. Multimodal checkpoints used text-only.
  gemma3-4b-it:
    hf_id: google/gemma-3-4b-it
    origin: Google
    kind: family
    tuned: true
    partition: h200
    batch_size: 16
    note: Gemma3ForConditionalGeneration; the runner takes the text tower. Cached on scratch.
  gemma3-12b-it:
    hf_id: google/gemma-3-12b-it
    origin: Google
    kind: family
    tuned: true
    partition: h200
    batch_size: 8
    note: scale partner for gemma3-4b-it. Cached on scratch.

  # ---- third family: AI2 (fully open pretraining data, so contamination is auditable)
  olmo2-1b-it:
    hf_id: allenai/OLMo-2-0425-1B-Instruct
    origin: AI2
    kind: family
    tuned: true
    partition: h200
    batch_size: 32
  olmo2-7b-it:
    hf_id: allenai/OLMo-2-1124-7B-Instruct
    origin: AI2
    kind: family
    tuned: true
    partition: h200
    batch_size: 16

  # ---- fourth and fifth families
  phi35-mini-it:
    hf_id: microsoft/Phi-3.5-mini-instruct
    origin: Microsoft
    kind: family
    tuned: true
    partition: h200
    batch_size: 16
  granite31-8b-it:
    hf_id: ibm-granite/granite-3.1-8b-instruct
    origin: IBM
    kind: family
    tuned: true
    partition: h200
    batch_size: 16

  # ---- model-kind axis (2026-09-20): one spine, Llama-3.1-8B-Instruct, five kinds of tuning.
  # The three tuned entries are obtune project artefacts (LoRA r=32 on the instruct model), folded
  # into the weights at load time. They share the instruct tokenizer, so the verified word pool and
  # every token position carry over unchanged.
  llama31-8b-it-ft:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    adapter: /work/jvl210002/migration/obtune/runs/adapters/llama31-8b/python/L0_r32_s42/best
    origin: Meta + obtune LoRA
    kind: tuned
    tuned: true
    partition: h100
    batch_size: 16
    note: single-task domain finetune (python, L0, seed 42).
  llama31-8b-it-ftmulti:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    adapter: /work/jvl210002/migration/obtune/runs/adapters/llama31-8b/python/L0-L1b-L1r-L2-S1-S2_r32_s42/best
    origin: Meta + obtune LoRA
    kind: tuned
    tuned: true
    partition: h100
    batch_size: 16
    note: joint multi-task finetune over six tasks (seed 42).
  llama31-8b-it-merged:
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    adapter: /work/jvl210002/migration/obtune/runs/merges/llama31-8b_python_ties/d0p5
    origin: Meta + obtune TIES merge
    kind: tuned
    tuned: true
    partition: h100
    batch_size: 16
    note: TIES merge (density 0.5) of six single-task adapters.
  nemotron-nano-8b:
    hf_id: nvidia/Llama-3.1-Nemotron-Nano-8B-v1
    origin: NVIDIA
    kind: reasoning
    tuned: true
    partition: h100
    batch_size: 16
    note: reasoning-tuned on the Llama-3.1-8B spine; the E16 row's model finally available in a non-Chinese checkpoint.
