# juno (SLURM 24.11.5). h200 and normal share QoS `juno` (MaxJobsPU=4) with the account's other
# projects; a30 and h100 carry no QoS, and everything here fits on them: bf16 inference of an 8B
# model is 16 GB, and no experiment trains a model. Default to a30 for <=4B and h100 for 8B.
# Exclude g-06-01 on h100 (MIG 3g.47gb slices, measured 2.8x slower by obtune).
slurm:
  partitions:
    a30:  {gres: "gpu:1", cpus: 8, mem: "48G", time: "08:00:00"}
    h100: {gres: "gpu:1", cpus: 8, mem: "64G", time: "08:00:00", exclude: "g-06-01"}
    h200: {gres: "gpu:1", cpus: 8, mem: "64G", time: "08:00:00", qos_shared: true}
    dev:  {gres: null, cpus: 4, mem: "32G", time: "00:30:00"}   # CPU only; tokenizer checks, tests
  log_dir_rel: log/slurm
# Storage (corrected 2026-09-13 after measuring): hidden states at all layers, fp16, at 13 labelled
# positions per instance = 13 x 29 x 3072 x 2 B = 2.3 MB/instance for a 3B model (3.5 MB for 8B).
# Per (model, level): 2 regimes x (2 x 10k train + 10 x 2k test) = 254 GB with the *_alt groups,
# ~150 GB without (20_run_model.py now skips their forced pass by default). The four levels of
# two models used 1.8 TB and hit ENOSPC on 2026-09-13; the scratch quota behaves like ~3 TB per
# user despite df reporting 27 TB free. Delete caches of finished levels or use --layers.
